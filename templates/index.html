<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Intel Classifier</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #05070a;
      --card-bg: #0d1117;
      --accent: #4f46e5;
      --accent-soft: rgba(79, 70, 229, 0.1);
      --text-main: #f8fafc;
      --text-dim: #94a3b8;
      --border: #1e293b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, transparent 50%);
      z-index: -1;
    }

    .container {
      width: 100%;
      max-width: 500px;
      animation: fadeIn 0.8s ease-out;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    header p {
      color: var(--text-dim);
      font-size: 0.9rem;
      font-weight: 400;
    }

    .main-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    .upload-area {
      border: 2px dashed var(--border);
      border-radius: 18px;
      padding: 40px 20px;
      text-align: center;
      transition: all 0.3s ease;
      cursor: pointer;
      position: relative;
      background: rgba(255, 255, 255, 0.02);
    }

    .upload-area:hover {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .upload-area p {
      font-size: 0.95rem;
      color: var(--text-dim);
    }

    .upload-area p span {
      color: var(--accent);
      font-weight: 600;
    }

    #file-input {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    .preview-box {
      display: none;
      margin-top: 24px;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .preview-box img {
      width: 100%;
      display: block;
      max-height: 250px;
      object-fit: cover;
    }

    .framework-selector {
      display: flex;
      background: #000;
      padding: 4px;
      border-radius: 12px;
      margin-top: 24px;
      border: 1px solid var(--border);
    }

    .f-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      color: var(--text-dim);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.2s;
    }

    .f-btn.active {
      background: var(--accent);
      color: white;
    }

    .btn-primary {
      width: 100%;
      margin-top: 24px;
      padding: 16px;
      border-radius: 14px;
      border: none;
      background: white;
      color: black;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      background: #f1f5f9;
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #result-section {
      display: none;
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
    }

    .res-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .res-label {
      font-size: 1.4rem;
      font-weight: 800;
      text-transform: capitalize;
    }

    .res-badge {
      background: var(--accent-soft);
      color: var(--accent);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    .bar-container { margin-bottom: 12px; }
    .bar-info {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      margin-bottom: 6px;
      color: var(--text-dim);
    }
    .bar-bg {
      height: 6px;
      background: #161b22;
      border-radius: 10px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      background: var(--accent);
      width: 0;
      transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .loader {
      width: 18px; height: 18px;
      border: 2px solid #000;
      border-bottom-color: transparent;
      border-radius: 50%;
      display: inline-block;
      animation: rotation 1s linear infinite;
      margin-right: 10px;
      vertical-align: middle;
    }

    @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Intel Scene Classification</h1>
    <p>Scene analysis across six natural categories</p>
  </header>

  <div class="main-card">
    <div class="upload-area" id="drop-zone">
      <input type="file" id="file-input" accept="image/*">
      <p>Drop image or <span>click to browse</span></p>
    </div>

    <div class="preview-box" id="preview-box">
      <img id="image-display" src="">
    </div>

    <div class="framework-selector">
      <button class="f-btn active" data-val="PyTorch">PyTorch</button>
      <button class="f-btn" data-val="Keras">TensorFlow</button>
    </div>

    <button id="analyze-btn" class="btn-primary" disabled>Start Analysis</button>

    <div id="result-section">
      <div class="res-header">
        <div class="res-label" id="main-pred">Result</div>
        <div class="res-badge" id="backend-used">PYTORCH</div>
      </div>
      <div id="prob-bars"></div>
    </div>
  </div>
</div>

<script>
  let selectedFile = null;
  let currentBackend = "PyTorch";

  const fileInput = document.getElementById('file-input');
  const analyzeBtn = document.getElementById('analyze-btn');
  const previewBox = document.getElementById('preview-box');
  const imgDisplay = document.getElementById('image-display');
  const resultSection = document.getElementById('result-section');

  // Backend Toggle
  document.querySelectorAll('.f-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.f-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentBackend = btn.dataset.val;
    });
  });

  // Handle File Select
  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
      selectedFile = file;
      imgDisplay.src = URL.createObjectURL(file);
      previewBox.style.display = 'block';
      analyzeBtn.disabled = false;
      resultSection.style.display = 'none';
    }
  });

  // Handle Analysis
  analyzeBtn.addEventListener('click', async () => {
    analyzeBtn.disabled = true;
    analyzeBtn.innerHTML = '<span class="loader"></span> Processing...';

    const formData = new FormData();
    formData.append('image', selectedFile);
    formData.append('backend', currentBackend);

    try {
      const response = await fetch('/predict', { method: 'POST', body: formData });
      const data = await response.json();

      if (data.error) {
        alert("Server error: " + data.error);
        return;
      }

      displayResults(data);
    } catch (error) {
      console.error(error);
      alert("Analysis failed. Please check server connection.");
    } finally {
      analyzeBtn.disabled = false;
      analyzeBtn.textContent = 'Start Analysis';
    }
  });

  function displayResults(data) {
    resultSection.style.display = 'block';
    document.getElementById('main-pred').textContent = data.prediction;
    document.getElementById('backend-used').textContent = data.backend.toUpperCase();
    
    const container = document.getElementById('prob-bars');
    container.innerHTML = '';

    // Correction : "data.all" au lieu de "data.all_predictions"
    data.all.forEach(item => {
      const row = document.createElement('div');
      row.className = 'bar-container';
      row.innerHTML = `
        <div class="bar-info">
          <span style="text-transform: capitalize">${item.class}</span>
          <span>${item.confidence.toFixed(1)}%</span>
        </div>
        <div class="bar-bg">
          <div class="bar-fill" style="width: ${item.confidence}%"></div>
        </div>
      `;
      container.appendChild(row);
    });
    
    resultSection.scrollIntoView({ behavior: 'smooth', block: 'end' });
  }
</script>

</body>
</html>
